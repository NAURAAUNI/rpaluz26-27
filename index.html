<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RP ALUZ DI KARAKTER</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 15%, #292929 0%, #111 35%, #030303 80%);
    color: white;
    font-family: Arial, sans-serif;
}

/* COVER */

.cover {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

.cover-box {
    width: min(720px, 95%);
    text-align: center;
    padding: 70px 30px;

    background: rgba(10,10,10,.8);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 28px;

    box-shadow: 0 30px 90px rgba(0,0,0,.8);
}

.logo {
    color: #999;
    font-size: 12px;
    letter-spacing: 8px;
    margin-bottom: 30px;
}

h1 {
    font-family: Georgia, serif;
    font-size: clamp(45px, 10vw, 80px);
    font-weight: normal;
    line-height: .9;
    letter-spacing: 5px;
}

.subtitle {
    margin-top: 22px;
    color: #aaa;
    font-size: 12px;
    letter-spacing: 3px;
}

.line {
    width: 80px;
    height: 1px;
    margin: 35px auto;

    background: linear-gradient(
        to right,
        transparent,
        white,
        transparent
    );
}

.cover-text {
    max-width: 480px;
    margin: auto;

    color: #999;
    font-size: 13px;
    line-height: 1.9;
}

.enter {
    display: inline-block;
    margin-top: 35px;
    padding: 14px 32px;

    border: 1px solid #555;
    border-radius: 30px;

    color: white;
    text-decoration: none;

    font-size: 11px;
    letter-spacing: 3px;

    transition: .3s;
}

.enter:hover {
    background: white;
    color: black;
}

/* QR */

.qr-section {
    display: none;
    padding: 60px 15px;
}

.qr-section.active {
    display: block;
}

.header {
    text-align: center;
    margin-bottom: 45px;
}

.header h2 {
    font-family: Georgia, serif;
    font-size: 38px;
    font-weight: normal;
    letter-spacing: 3px;
}

.header p {
    margin-top: 10px;
    color: #777;
    font-size: 12px;
    letter-spacing: 2px;
}

.grid {
    max-width: 1100px;
    margin: auto;

    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 22px;
}

.qr-card {
    background: #111;

    border: 1px solid #2d2d2d;
    border-radius: 20px;

    padding: 25px;

    text-align: center;

    transition: .3s;
}

.qr-card:hover {
    transform: translateY(-5px);
    border-color: #555;
}

.nomor {
    color: #555;
    font-size: 10px;
    letter-spacing: 3px;
}

.nama {
    margin: 12px 0 18px;

    font-family: Georgia, serif;
    font-size: 27px;
}

.qr {
    width: 190px;
    height: 190px;

    margin: auto;
    padding: 10px;

    background: white;
}

.qr img {
    width: 100%;
    height: 100%;
}

.link {
    margin: 13px 0;

    color: #555;
    font-size: 9px;

    word-break: break-all;
}

.download {
    border: 1px solid #555;
    background: transparent;

    color: white;

    padding: 9px 17px;

    border-radius: 20px;

    cursor: pointer;

    font-size: 10px;
    letter-spacing: 1px;
}

.download:hover {
    background: white;
    color: black;
}

.kembali {
    display: block;

    width: fit-content;
    margin: 45px auto 0;

    color: #777;
    text-decoration: none;

    font-size: 11px;
}

.kembali:hover {
    color: white;
}
</style>
</head>

<body>

<!-- =========================
     COVER
========================= -->

<section class="cover" id="cover">

    <div class="cover-box">

        <div class="logo">
            RP ALUZ
        </div>

        <h1>
            DI<br>
            KARAKTER
        </h1>

        <div class="subtitle">
            25 QR • 25 KARAKTER
        </div>

        <div class="line"></div>

        <p class="cover-text">
            Setiap orang memiliki karakter yang berbeda.
            Sekarang waktunya menemukan karakter
            masing-masing melalui QR rahasia.
            <br><br>
            Pilih nama untuk melihat QR-nya.
        </p>

        <a href="#qr" class="enter">
            LIHAT QR
        </a>

    </div>

</section>


<!-- =========================
     QR SECTION
========================= -->

<section class="qr-section" id="qr">

    <div class="header">

        <div class="logo">
            RP ALUZ
        </div>

        <h2>
            QR DI KARAKTER
        </h2>

        <p>
            25 ORANG • 25 QR • 1 KELUARGA
        </p>

    </div>

    <div class="grid" id="qrContainer"></div>

    <a
        href="#cover"
        class="kembali">

        ↑ KEMBALI KE COVER

    </a>

</section>


<script>

/* =========================
   DATA NAMA
========================= */

const nama = [

    "Ghea",
    "Naura",
    "Nala",
    "Azzira",
    "Fidel",
    "Adli",
    "Reona",
    "Zuhrah",
    "Arif",
    "Annisa",
    "Marcel",
    "Arzak",
    "Via",
    "Elif",
    "Meme",
    "Desfa",
    "Nickyta",
    "Asoka",
    "Firly",
    "Andre",
    "Bunga",
    "Eggy",
    "Dani",
    "Akbar",
    "Fauzan"

];


/* =========================
   WEBSITE UTAMA
========================= */

const website =
"https://nauraauni.github.io/rpaluz26-27/";


/* =========================
   CONTAINER
========================= */

const container =
document.getElementById("qrContainer");


/* =========================
   BUAT 25 QR
========================= */

nama.forEach((orang, index) => {

    const kode =
        orang
        .toLowerCase()
        .replace(/\s/g, "");

    const link =
        website + "#" + kode;

    const qr =
        "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="
        + encodeURIComponent(link);


    const card =
        document.createElement("div");

    card.className =
        "qr-card";


    card.innerHTML = `

        <div class="nomor">
            QR ${String(index + 1).padStart(2,"0")}
        </div>

        <div class="nama">
            ${orang}
        </div>

        <div class="qr">

            <img
                id="qr-${kode}"
                src="${qr}"
                alt="QR ${orang}"
            >

        </div>

        <div class="link">
            ${link}
        </div>

        <button
            class="download"
            onclick="downloadQR(
                '${kode}',
                '${orang}'
            )">

            DOWNLOAD QR

        </button>

    `;

    container.appendChild(card);

});


/* =========================
   DOWNLOAD QR
========================= */

async function downloadQR(kode, orang) {

    const gambar =
        document.getElementById(
            "qr-" + kode
        );

    try {

        const response =
            await fetch(gambar.src);

        const blob =
            await response.blob();

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "QR-" + orang + ".png";

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(url);

    }

    catch (error) {

        alert(
            "Klik kanan pada QR lalu pilih " +
            "'Simpan gambar sebagai'."
        );

    }

}


/* =========================
   OTOMATIS BUKA QR
========================= */

function cekHash() {

    if (window.location.hash === "#qr") {

        document
            .getElementById("cover")
            .style.display = "none";

        document
            .getElementById("qr")
            .classList.add("active");

    }

}

cekHash();

window.addEventListener(
    "hashchange",
    cekHash
);

</script>

</body>
</html>
