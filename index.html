<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RP ALUZ DI KARAKTER</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 30%, #242424 0%, #111 35%, #050505 75%);
    color: white;
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 45px 45px;
}

/* PARTICLES */

.particle {
    position: fixed;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: .3;
    animation: float 8s infinite ease-in-out;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
        opacity: .1;
    }
    50% {
        transform: translateY(-80px);
        opacity: .6;
    }
}

/* MAIN */

.container {
    width: min(92%, 700px);
    margin: auto;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 0;
}

.card {
    width: 100%;
    text-align: center;
    padding: 55px 30px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(10,10,10,.72);
    backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.65);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
}

.logo {
    font-size: 12px;
    letter-spacing: 6px;
    color: #999;
    margin-bottom: 30px;
}

h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(42px, 10vw, 78px);
    font-weight: 500;
    letter-spacing: 4px;
    line-height: .9;
}

.subtitle {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 5px;
    color: #aaa;
    text-transform: uppercase;
}

.line {
    width: 80px;
    height: 1px;
    background: linear-gradient(to right, transparent, white, transparent);
    margin: 35px auto;
}

.description {
    color: #999;
    line-height: 1.8;
    font-size: 13px;
    max-width: 450px;
    margin: auto;
}

button {
    margin-top: 35px;
    padding: 15px 35px;
    background: transparent;
    color: white;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 50px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .4s;
}

button:hover {
    background: white;
    color: black;
    box-shadow: 0 0 35px rgba(255,255,255,.2);
}

/* REVEAL */

.hidden {
    display: none;
}

.reveal {
    animation: reveal .9s ease forwards;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.number {
    font-size: 10px;
    letter-spacing: 5px;
    color: #666;
    margin-bottom: 15px;
}

.name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(55px, 15vw, 100px);
    text-transform: uppercase;
    letter-spacing: 5px;
}

.colors {
    font-size: 40px;
    margin: 25px 0;
    letter-spacing: 8px;
}

.character-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 31px;
    font-style: italic;
    margin-bottom: 18px;
}

.character-type {
    font-size: 10px;
    letter-spacing: 3px;
    color: #999;
    text-transform: uppercase;
}

.quote {
    margin: 28px auto;
    max-width: 470px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    line-height: 1.5;
    color: #ddd;
}

.message {
    max-width: 470px;
    margin: auto;
    font-size: 13px;
    line-height: 1.9;
    color: #999;
}

.footer {
    margin-top: 45px;
    font-size: 9px;
    letter-spacing: 4px;
    color: #555;
}

/* COLOR EFFECTS */

.black-glow {
    box-shadow:
        0 0 100px rgba(0,0,0,.9),
        inset 0 0 70px rgba(255,255,255,.015);
}

.grey-glow {
    box-shadow:
        0 0 100px rgba(160,160,160,.08),
        inset 0 0 70px rgba(180,180,180,.03);
}

.white-glow {
    box-shadow:
        0 0 100px rgba(255,255,255,.1),
        inset 0 0 70px rgba(255,255,255,.04);
}

.green-glow {
    box-shadow:
        0 0 100px rgba(70,255,150,.18),
        inset 0 0 70px rgba(70,255,150,.04);
}

.green-text {
    color: #75e6a5;
}

.small-note {
    margin-top: 20px;
    font-size: 10px;
    color: #555;
}
</style>
</head>

/* =========================================
   START REVEAL
========================================= */

function startReveal() {

    const hash = window.location.hash
        .replace("#", "")
        .toLowerCase();

    let key = hash;

    /*
      Kalau tidak ada QR/hash,
      otomatis tampilkan Ghea untuk preview.
    */

    if (!members[key]) {
        key = "ghea";
    }

    const person = members[key];

    const keys = Object.keys(members);
    const index = keys.indexOf(key) + 1;

    document.getElementById("opening").classList.add("hidden");

    const reveal = document.getElementById("reveal");

    reveal.className = "card reveal";

    document.getElementById("number").textContent =
        "CHARACTER " + String(index).padStart(2, "0");

    document.getElementById("name").textContent =
        person.name;

    document.getElementById("colors").textContent =
        person.colors;

    document.getElementById("type").textContent =
        person.type;

    document.getElementById("characterName").textContent =
        person.character;

    document.getElementById("quote").textContent =
        "“" + person.quote + "”";

    document.getElementById("message").textContent =
        person.message;

    /* warna card */

    if (person.colors.includes("💚")) {
        reveal.classList.add("green-glow");
        document.getElementById("characterName")
            .classList.add("green-text");
    }
    else if (person.colors === "🤍") {
        reveal.classList.add("white-glow");
    }
    else if (person.colors.includes("🩶")) {
        reveal.classList.add("grey-glow");
    }
    else {
        reveal.classList.add("black-glow");
    }
}


/* =========================================
   AUTO OPEN JIKA ADA QR
========================================= */

if (window.location.hash) {
    setTimeout(startReveal, 700);
